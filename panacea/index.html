<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>I Study These Organs in Search of an Equinox</title>

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: white;
      overflow: hidden;
      font-family: Arial, sans-serif; /* mantiene il font originale */
    }

    /* contenitore generale */
    .page {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding-top: 5vh;
      padding-bottom: 5vh;
      box-sizing: border-box;
    }

    /* contenitore immagine */
    .stage {
      display: flex;
      justify-content: center;
      align-items: center;
      width: 100%;
      height: 100%;
    }

    .stage img {
      max-width: 90vw;      /* non più del 90% della larghezza viewport */
      max-height: 90vh;     /* non più del 90% dell’altezza viewport */
      width: auto;
      height: auto;
      display: block;
      object-fit: contain;   /* mantiene proporzioni e centra l'immagine */
    }

    /* link come nel vecchio index */
    .tech-link {
      margin-top: 18px;     /* distanza originale dall'immagine */
      font-size: 12px;      /* dimensione originale */
      color: #555;
      text-decoration: none;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      white-space: nowrap;
    }

    @media (max-width: 768px) {
      .tech-link {
        margin-top: 22px;   /* distanza leggermente maggiore su mobile */
        font-size: 10px;    /* dimensione leggermente più piccola su mobile */
      }
    }
  </style>
</head>

<body>

  <div class="page">

    <div class="stage">
      <img
        src="IStudyTheseOrgansinSearchofanEquinox.png"
        alt="I Study These Organs in Search of an Equinox">
    </div>

    <a
      class="tech-link"
      href="istudytheseorgansinsearchofanequinox_technicalspecifications.html"
      target="_blank">
      Technical specifications
    </a>

  </div>

</body>
</html>
