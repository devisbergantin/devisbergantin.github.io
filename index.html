<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Three Mimes Show</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: white;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .video-wrapper {
      width: 90%;
      max-width: 1920px;
      height: 80vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: white;
    }

    video {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
    }
  </style>
</head>
<body>
  <div class="video-wrapper">
    <video autoplay loop muted playsinline>
      <source src="threemimesshow.mp4" type="video/mp4">
    </video>
  </div>
</body>
</html>
