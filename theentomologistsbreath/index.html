<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Respiro</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: white; /* sfondo bianco */
      font-family: Arial, sans-serif;
      overflow: hidden;
    }

    .container {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center; /* centra verticalmente */
      align-items: center;     /* centra orizzontalmente */
    }

    .stage-wrapper {
      max-width: 85%;
      max-height: 78%;
      width: 100%;
      height: auto;
      position: relative;
    }

    .stage-wrapper object,
    .stage-wrapper canvas {
      width: 100%;
      height: 100%;
      position: absolute;
      top: 0;
      left: 0;
    }

    .tech-link {
      margin-top: 18px;  /* distanza identica all'index vecchio */
      font-size: 12px;
      color: #555;
      text-decoration: none;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      white-space: nowrap;
    }

    @media (max-width: 768px) {
      .stage-wrapper {
        max-width: 90%;
        max-height: 72%;
      }
      .tech-link {
        margin-top: 22px;
        font-size: 10px;
      }
    }
  </style>
</head>

<body>
  <div class="container">

    <div class="stage-wrapper">
      <!-- SVG animato -->
      <object data="Respiroversionedefinitiva.svg" type="image/svg+xml"></object>

      <!-- Canvas per il glitch -->
      <canvas id="glitchCanvas"></canvas>
    </div>

    <!-- Link centrato come prima -->
    <a class="tech-link" href="technicalspecifications.html" target="_blank">
      Technical specifications
    </a>

  </div>

  <script src="glitch.js"></script>
</body>
</html>
