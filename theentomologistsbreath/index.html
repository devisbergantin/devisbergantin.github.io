<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <title>Respiro</title>

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: white;
      font-family: Arial, sans-serif;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .page {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .stage {
      position: relative;
      max-width: 85vw;
      max-height: 78vh;
      aspect-ratio: 1920 / 1440;
      background: black;
    }

    object,
    canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
    }

    canvas {
      pointer-events: none;
    }

    .tech-link {
      margin-top: 18px;
      font-size: 12px;
      color: #555;
      text-decoration: none;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      white-space: nowrap;
    }

    @media (max-width: 768px) {
      .stage {
        max-width: 90vw;
        max-height: 72vh;
      }

      .tech-link {
        margin-top: 22px;
        font-size: 10px;
      }
    }
  </style>
</head>

<body>

  <div class="page">

    <div class="stage">
      <object
        data="Respiroversionedefinitiva.svg"
        type="image/svg+xml">
      </object>

      <canvas id="glitchCanvas"></canvas>
    </div>

    <a
      class="tech-link"
      href="https://devisbergantin.github.io/theentomologistsbreath/glpng">
      Back to main page
    </a>

  </div>

  <script src="glitch.js"></script>

</body>
</html>
