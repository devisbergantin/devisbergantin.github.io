<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <title>Respiro</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: black;
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }

    .stage {
      width: 90vw;               /* occupa il 90% della larghezza del viewport */
      max-width: 1920px;         /* non eccede dimensioni originali */
      aspect-ratio: 1920 / 1440; /* mantiene proporzioni perfette */
      position: relative;
      background: black;
    }

    object, canvas {
      width: 100%;
      height: 100%;
      position: absolute;
      top: 0;
      left: 0;
    }

    .tech-link {
      margin-top: 20px;
      font-size: 12px;
      color: #555;
      text-decoration: none;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      white-space: nowrap;
      text-align: center;
    }

    @media (max-width: 768px) {
      .tech-link {
        font-size: 10px;
        margin-top: 15px;
      }
    }
  </style>
</head>
<body>

  <div class="stage">
    <!-- SVG animato di base -->
    <object
      data="Respiroversionedefinitiva.svg"
      type="image/svg+xml">
    </object>

    <!-- Canvas per il glitch -->
    <canvas id="glitchCanvas"></canvas>
  </div>

  <!-- Link centrato alle specifiche tecniche -->
  <a
    class="tech-link"
    href="technicalspecifications.html"
    target="_blank">
    Specifiche tecniche
  </a>

  <!-- Script glitch -->
  <script src="glitch.js"></script>
</body>
</html>
