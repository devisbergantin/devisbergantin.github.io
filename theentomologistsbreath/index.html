<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <title>Respiro</title>

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: white;
      font-family: Arial, sans-serif;
      overflow: hidden;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .page {
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      padding: 48px 0 36px;
      box-sizing: border-box;
    }

    /* CONTENITORE ANIMAZIONE */
    .stage-wrapper {
      width: 60vw;              /* chiave: dà una base reale */
      max-width: 1200px;
      max-height: 60vh;
    }

    .stage {
      position: relative;
      width: 100%;
      padding-top: 75%;         /* 1440 / 1920 */
      background: black;
    }

    object,
    canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
    }

    canvas {
      pointer-events: none;
    }

    /* LINK */
    .tech-link {
      font-size: 12px;
      color: #555;
      text-decoration: none;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      white-space: nowrap;
    }

    @media (max-width: 768px) {
      .page {
        padding: 36px 0 30px;
      }

      .stage-wrapper {
        width: 85vw;
        max-height: 55vh;
      }

      .tech-link {
        font-size: 10px;
      }
    }
  </style>
</head>

<body>

  <div class="page">

    <div class="stage-wrapper">
      <div class="stage">
        <object
          data="Respiroversionedefinitiva.svg"
          type="image/svg+xml">
        </object>

        <canvas id="glitchCanvas"></canvas>
      </div>
    </div>

    <a
      class="tech-link"
      href="technicalspecifications_respiro.html"
      target="_blank">
      Technical specifications
    </a>

  </div>

  <script src="glitch.js"></script>

</body>
</html>
