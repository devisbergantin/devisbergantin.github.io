<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>The Entomologist's Breath</title>

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: white;
      overflow: hidden;
      font-family: Arial, sans-serif;
    }

    /* contenitore generale */
    .page {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }

    /* stage dell’animazione */
    .stage {
      position: relative;
      width: 85vw;
      height: calc(85vw * 0.75); /* 1920x1440 */
      max-width: 85%;
      max-height: 78%;
      background: black;
      overflow: hidden;
    }

    .stage object,
    .stage canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
    }

    /* link come nel vecchio index */
    .tech-link {
      margin-top: 18px;
      font-size: 12px;
      color: #555;
      text-decoration: none;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      white-space: nowrap;
    }

    @media (max-width: 768px) {
      .stage {
        width: 90vw;
        max-height: 72vh;
      }

      .tech-link {
        margin-top: 22px;
        font-size: 10px;
      }
    }
  </style>
</head>

<body>

  <div class="page">

    <div class="stage">
      <!-- SVG -->
      <object
        data="Respiroversionedefinitiva.svg"
        type="image/svg+xml">
      </object>

      <!-- Canvas glitch -->
      <canvas id="glitchCanvas"></canvas>
    </div>

    <!-- Link -->
    <a
      class="tech-link"
      href="technicalspecifications.html"
      target="_blank">
      Technical specifications
    </a>

  </div>

  <!-- Glitch -->
  <script src="glitch.js"></script>

</body>
</html>
