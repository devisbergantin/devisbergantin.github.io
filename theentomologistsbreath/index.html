<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <title>Respiro</title>

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: white;
      font-family: Arial, sans-serif;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .page {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 60px 0 50px; /* spazio sopra e sotto */
    }

    /* CONTENITORE RESPONSIVE */
    .stage-wrapper {
      width: 75vw;            /* più spazio bianco ai lati */
      max-width: 1600px;
      margin-bottom: 28px;    /* spazio sotto l’animazione */
    }

    .stage {
      position: relative;
      width: 100%;
      padding-top: 75%; /* 1440 / 1920 */
      background: black;
    }

    object,
    canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
    }

    canvas {
      pointer-events: none;
    }

    /* AREA LINK */
    .links {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }

    .tech-link {
      font-size: 12px;
      color: #555;
      text-decoration: none;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      white-space: nowrap;
    }

    @media (max-width: 768px) {
      .page {
        padding: 40px 0 40px;
      }

      .stage-wrapper {
        width: 90vw;
        margin-bottom: 30px;
      }

      .tech-link {
        font-size: 10px;
      }
    }
  </style>
</head>

<body>

  <div class="page">

    <div class="stage-wrapper">
      <div class="stage">
        <object
          data="Respiroversionedefinitiva.svg"
          type="image/svg+xml">
        </object>

        <canvas id="glitchCanvas"></canvas>
      </div>
    </div>

    <div class="links">
      <a
        class="tech-link"
        href="technicalspecifications_respiro.html"
        target="_blank">
        Technical specifications
      </a>

      <a
        class="tech-link"
        href="https://devisbergantin.github.io/theentomologistsbreath/glpng">
        Back to main page
      </a>
    </div>

  </div>

  <script src="glitch.js"></script>

</body>
</html>
