<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <title>Respiro</title>

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: white;
      font-family: Arial, sans-serif;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .page {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* CONTENITORE RESPONSIVE STABILE */
    .stage-wrapper {
      width: 85vw;
      max-width: 1920px;
    }

    .stage {
      position: relative;
      width: 100%;
      padding-top: 75%; /* 1440 / 1920 = 0.75 */
      background: black;
    }

    object,
    canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
    }

    canvas {
      pointer-events: none;
    }

    .tech-link {
      margin-top: 18px;
      font-size: 12px;
      color: #555;
      text-decoration: none;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      white-space: nowrap;
    }

    @media (max-width: 768px) {
      .stage-wrapper {
        width: 90vw;
      }

      .tech-link {
        margin-top: 22px;
        font-size: 10px;
      }
    }
  </style>
</head>

<body>

  <div class="page">

    <div class="stage-wrapper">
      <div class="stage">
        <object
          data="Respiroversionedefinitiva.svg"
          type="image/svg+xml">
        </object>

        <canvas id="glitchCanvas"></canvas>
      </div>
    </div>

    <a
      class="tech-link"
      href="https://devisbergantin.github.io">
      Back to main page
    </a>

  </div>

  <script src="glitch.js"></script>

</body>
</html>
