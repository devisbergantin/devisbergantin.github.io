<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>The Entomologist's Breath</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    html, body {
      margin: 0;
      padding: 0;
      background: white; /* cornice bianca */
      width: 100%;
      height: 100%;
      font-family: Arial, sans-serif;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    #container {
      position: relative;
      background: black; /* sfondo dell'animazione */
      max-width: 85vw;
      max-height: 78vh;
      aspect-ratio: 1920 / 1440; /* mantiene proporzioni */
      display: flex;
      justify-content: center;
      align-items: center;
      box-shadow: 0 0 0 20px white; /* cornice bianca */
    }

    canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 1920px;
      height: 1440px;
      pointer-events: none;
      z-index: 2;
      background: transparent; /* deve essere trasparente */
    }

    canvas {
      pointer-events: none;
      z-index: 2; /* glitch sopra SVG */
    }

    .links {
      position: absolute;
      bottom: 10px;
      width: 100%;
      display: flex;
      justify-content: center;
      gap: 30px;
      z-index: 3;
    }

    .links a {
      color: #555;
      text-decoration: none;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      background: rgba(255,255,255,0.8);
      padding: 6px 12px;
      border-radius: 4px;
      transition: 0.2s;
    }

    .links a:hover {
      background: rgba(255,255,255,1);
    }

    @media (max-width: 768px) {
      #container {
        max-width: 90vw;
        max-height: 72vh;
      }

      .links a {
        font-size: 10px;
        padding: 4px 10px;
      }
    }
  </style>
</head>

<body>

  <div id="container">
    <!-- SVG animato -->
    <object data="Respiroversionedefinitiva.svg" type="image/svg+xml"></object>

    <!-- Canvas per glitch -->
<canvas id="glitchCanvas"></canvas>

    <!-- Link -->
    <div class="links">
      <a href="technicalspecifications_theentomologistsbreath.html" target="_blank">
        Technical specifications
      </a>
      <a href="https://devisbergantin.github.io/" target="_self">
        Home
      </a>
    </div>
  </div>

  <!-- Script glitch -->
  <script src="glitch.js"></script>

</body>
</html>
