<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Respiro</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: white;
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }

    .stage-wrapper {
      width: 90vw;
      max-width: 1920px;
      aspect-ratio: 1920 / 1440;
      position: relative;
      background: white;
      display: flex;
      justify-content: center;
      align-items: center;
      margin-top: 5vh; /* aggiunge spazio bianco sopra */
      margin-bottom: 5vh; /* mantiene spazio bianco sotto */
    }

    .stage-wrapper object,
    .stage-wrapper canvas {
      width: 100%;
      height: 100%;
      position: absolute;
      top: 0;
      left: 0;
    }

    .tech-link {
      margin-top: 20px;
      font-size: 12px;
      color: #555;
      text-decoration: none;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      text-align: center;
      flex-shrink: 0;
    }

    @media (max-width: 768px) {
      .stage-wrapper {
        width: 95vw;
        margin-top: 3vh; /* leggero padding-top per mobile */
        margin-bottom: 3vh;
      }

      .tech-link {
        font-size: 10px;
        margin-top: 15px;
      }
    }
  </style>
</head>
<body>

  <div class="stage-wrapper">
    <object data="Respiroversionedefinitiva.svg" type="image/svg+xml"></object>
    <canvas id="glitchCanvas"></canvas>
  </div>

  <a class="tech-link" href="technicalspecifications.html" target="_blank">
    Technical specifications
  </a>

  <script src="glitch.js"></script>
</body>
</html>
