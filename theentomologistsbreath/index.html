<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <title>Respiro</title>

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: black;
      overflow: hidden;
      font-family: Arial, sans-serif;
    }

    .container {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }

    .stage {
      position: relative;
      width: 100%;
      max-width: 1920px;
      aspect-ratio: 1920 / 1440;
    }

    object,
    canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
    }

    object {
      z-index: 1;
    }

    canvas {
      z-index: 2;
      pointer-events: none;
    }

    .tech-link {
      margin-top: 18px;
      font-size: 12px;
      color: #555;
      text-decoration: none;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      white-space: nowrap;
    }

    @media (max-width: 768px) {
      .tech-link {
        margin-top: 22px;
        font-size: 10px;
      }
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="stage">
      <!-- SVG animato -->
      <object
        data="Respiroversionedefinitiva.svg"
        type="image/svg+xml">
      </object>

      <!-- Canvas glitch -->
      <canvas id="glitchCanvas"></canvas>
    </div>

    <!-- Link di rimando -->
    <a
      class="tech-link"
      href="https://devisbergantin.github.io/theentomologistsbreath/glpng">
      Back to main page
    </a>

  </div>

  <!-- Script glitch -->
  <script src="glitch.js"></script>

</body>
</html>
