<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Respiro</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: white;
      font-family: Arial, sans-serif;
      overflow: hidden; /* niente scroll */
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .container {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      width: 100%;
    }

    .stage-wrapper {
      width: 90%;          /* leggermente più grande */
      max-width: 1920px;
      max-height: 82vh;    /* leggermente più alta */
      aspect-ratio: 1920 / 1440; /* mantiene proporzioni */
      position: relative;
      background: white;
      flex-shrink: 0;
    }

    .stage-wrapper object,
    .stage-wrapper canvas {
      width: 100%;
      height: 100%;
      position: absolute;
      top: 0;
      left: 0;
    }

    .tech-link {
      margin-top: 18px; /* distanza identica al vecchio index */
      font-size: 12px;
      color: #555;
      text-decoration: none;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      white-space: nowrap;
    }

    @media (max-width: 768px) {
      .stage-wrapper {
        width: 95%;
        max-height: 75vh;
      }
      .tech-link {
        margin-top: 22px;
        font-size: 10px;
      }
    }
  </style>
</head>

<body>
  <div class="container">
    <div class="stage-wrapper">
      <object data="Respiroversionedefinitiva.svg" type="image/svg+xml"></object>
      <canvas id="glitchCanvas"></canvas>
    </div>

    <a class="tech-link" href="technicalspecifications.html" target="_blank">
      Technical specifications
    </a>
  </div>

  <script src="glitch.js"></script>
</body>
</html>
