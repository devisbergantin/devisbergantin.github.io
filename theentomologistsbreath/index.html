<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <title>Respiro</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    html, body {
      margin: 0;
      padding: 0;
      min-height: 100vh;       /* occupa almeno tutto lo schermo */
      background: black;
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
      justify-content: center;  /* centra verticalmente */
      align-items: center;      /* centra orizzontalmente */
    }

    .stage {
      width: 90vw;
      max-width: 1920px;
      aspect-ratio: 1920 / 1440;
      position: relative;
      background: black;
      flex-shrink: 0;           /* evita che si riduca troppo */
    }

    object, canvas {
      width: 100%;
      height: 100%;
      position: absolute;
      top: 0;
      left: 0;
    }

    .tech-link {
      margin-top: 25px;
      font-size: 12px;
      color: #555;
      text-decoration: none;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      white-space: nowrap;
      text-align: center;
      flex-shrink: 0;           /* link non si riduce */
    }

    @media (max-width: 768px) {
      .tech-link {
        font-size: 10px;
        margin-top: 15px;
      }
    }
  </style>
</head>
<body>

  <div class="stage">
    <object data="Respiroversionedefinitiva.svg" type="image/svg+xml"></object>
    <canvas id="glitchCanvas"></canvas>
  </div>

  <a class="tech-link" href="technicalspecifications.html" target="_blank">
    Specifiche tecniche
  </a>

  <script src="glitch.js"></script>
</body>
</html>
