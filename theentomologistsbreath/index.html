<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Respiro</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: white;
      font-family: Arial, sans-serif;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      flex-direction: column;
    }

    .stage-wrapper {
      max-width: 85%;
      width: 100%;
      aspect-ratio: 1920 / 1440; /* mantiene proporzioni */
      position: relative;
      background: white;
    }

    .stage-wrapper object,
    .stage-wrapper canvas {
      width: 100%;
      height: 100%;
      position: absolute;
      top: 0;
      left: 0;
    }

    .tech-link {
      margin-top: 18px;  /* distanza identica al vecchio index */
      font-size: 12px;
      color: #555;
      text-decoration: none;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      white-space: nowrap;
    }

    @media (max-width: 768px) {
      .stage-wrapper {
        max-width: 90%;
      }
      .tech-link {
        margin-top: 22px;
        font-size: 10px;
      }
    }
  </style>
</head>

<body>
  <div class="stage-wrapper">
    <object data="Respiroversionedefinitiva.svg" type="image/svg+xml"></object>
    <canvas id="glitchCanvas"></canvas>
  </div>

  <a class="tech-link" href="technicalspecifications.html" target="_blank">
    Technical specifications
  </a>

  <script src="glitch.js"></script>
</body>
</html>
