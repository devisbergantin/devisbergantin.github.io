<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Devis Bergantin | Portfolio</title>

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>

    body {
      margin: 0;
      padding: 24px;
      font-family: Arial, sans-serif;
      font-size: 14px;
      line-height: 1.5;
      color: #000;
      background-color: #fff;
    }

    /* PDF su desktop */

    .portfolio {
      width: 100%;
      max-width: 900px;
      height: calc(100vh - 120px);
      margin: 0 auto;
      display: block;
      border: none;
    }

    /* Messaggio mobile */

    .mobile-notice {
      display: none;
      text-align: center;
      max-width: 450px;
    }

    /* Area DOWNLOAD + homepage */

    .return {
      margin-top: 24px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      text-align: center;
    }

    a {
      color: #000;
      text-decoration: underline;
    }

    /* DOWNLOAD */

    .btn-download-mobile {
      display: inline-block;
      margin-top: 16px;
      padding: 14px 28px;
      background-color: #000;
      color: #fff !important;
      text-decoration: none;
      font-weight: bold;
      font-size: 16px;
      border-radius: 4px;
    }


    /* =========================
       MOBILE
    ========================== */

    @media (max-width: 991px) {

      body {
        margin: 0;
        padding: 20px;
        min-height: 100vh;

        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;

        box-sizing: border-box;

        font-size: 16px;
      }

      /* Nasconde completamente il PDF */

      .portfolio {
        display: none !important;
      }

      /* Mostra il messaggio */

      .mobile-notice {
        display: block !important;

        font-family: Arial, sans-serif;
        font-size: 16px;
        font-weight: normal;
        line-height: 1.5;

        text-align: center;

        margin: 0;
        padding: 0;
      }

      .mobile-notice p {
        margin: 0;
      }


      /* DOWNLOAD + Back to homepage */

      .return {
        margin-top: 24px;
        display: flex;
        flex-direction: column;
        gap: 6px;
        text-align: center;
      }

    }

  </style>
</head>


<body>


  <!-- PDF su desktop -->

  <iframe
    class="portfolio"
    src="DevisBergantin_Portfolio2026.pdf"
    title="Devis Bergantin | Portfolio 2026">
  </iframe>


  <!-- Messaggio su mobile -->

  <div class="mobile-notice">

    <p>
      Mobile browsers do not support the direct preview of this document.
      Please download the file to view the portfolio.
    </p>

  </div>


  <!-- DOWNLOAD + ritorno homepage -->

  <div class="return">

    <a
      href="DevisBergantin_Portfolio2026.pdf"
      download>
      DOWNLOAD
    </a>

    <a
      href="https://devisbergantin.github.io">
      Back to homepage
    </a>

  </div>


</body>
</html>
