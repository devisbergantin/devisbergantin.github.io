<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Devis Bergantin | Portfolio</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      margin: 0;
      padding: 24px;
      font-family: Arial, sans-serif;
      font-size: 14px;
      line-height: 1.5;
      color: #000;
      background-color: #fff;
    }

    .portfolio {
      width: 100%;
      max-width: 900px;
      height: calc(100vh - 120px);
      margin: 0 auto;
      display: block;
      border: none;
    }

    .return {
      margin-top: 24px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      text-align: center;
    }

    a {
      color: #000;
      text-decoration: underline;
    }

    @media (max-width: 600px) {
      body {
        font-size: 16px;
        padding: 20px;
      }

      .portfolio {
        width: 100%;
        height: calc(100vh - 130px);
        /* Forza i browser mobile a creare una finestra di scorrimento touch */
        overflow-y: auto;
        -webkit-overflow-scrolling: touch;
      }
    }
  </style>
</head>

<body>

  <!-- Uso OBJECT puntando al file locale nel repository -->
  <!-- Su PC si comporta come l'iframe -->
  <!-- Su mobile forza il browser a usare il motore di rendering nativo -->
  <object 
    class="portfolio" 
    data="DevisBergantin_Portfolio2026.pdf" 
    type="application/pdf">
    <iframe class="portfolio" src="DevisBergantin_Portfolio2026.pdf"></iframe>
  </object>

  <div class="return">
    <a href="DevisBergantin_Portfolio2026.pdf" download>DOWNLOAD</a>
    <a href="https://github.io" target="_blank" rel="noopener noreferrer">Back to homepage</a>
  </div>

</body>
</html>
