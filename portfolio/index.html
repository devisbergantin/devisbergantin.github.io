<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Devis Bergantin | Portfolio</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      margin: 0;
      padding: 24px;
      font-family: Arial, sans-serif;
      font-size: 14px;
      line-height: 1.5;
      color: #000;
      background-color: #fff;
    }

    .portfolio {
      width: 100%;
      max-width: 900px;
      height: calc(100vh - 120px);
      margin: 0 auto;
      display: block;
      border: none;
    }

    .mobile-notice {
      display: none;
      text-align: center;
      padding: 40px 20px;
      margin: 40px auto;
      max-width: 450px;
    }

    .btn-download-mobile {
      display: inline-block;
      margin-top: 16px;
      padding: 14px 28px;
      background-color: #000;
      color: #fff !important;
      text-decoration: none;
      font-weight: bold;
      font-size: 16px;
      border-radius: 4px;
    }

    .return {
      margin-top: 24px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      text-align: center;
    }

    a {
      color: #000;
      text-decoration: underline;
    }

    @media (max-width: 991px) {
      body {
        font-size: 16px;
        padding: 20px;
      }
      
      .portfolio {
        display: none !important;
      }

      .mobile-notice {
        display: block !important;
      }
    }
  </style>
</head>

<body>

  <!-- Su PC rimane l'iframe scorrevole -->
  <iframe
    class="portfolio"
    src="DevisBergantin_Portfolio2026.pdf"
    title="Devis Bergantin Portfolio 2026">
  </iframe>

  <!-- Su mobile solo testo statico, nessun automatismo di download -->
  <div class="mobile-notice">
    <p>Mobile browsers do not support the direct preview of this document. Please download the file to view the portfolio.</p>
  </div>

  <div class="return">
    <a href="DevisBergantin_Portfolio2026.pdf" download>DOWNLOAD</a>
    <a href="https://github.io" target="_blank" rel="noopener noreferrer">Back to homepage</a>
  </div>

</body>
</html>
