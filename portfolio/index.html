<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Devis Bergantin | Portfolio</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      margin: 0;
      padding: 24px;
      font-family: Arial, sans-serif;
      font-size: 14px;
      line-height: 1.5;
      color: #000;
      background-color: #fff;
    }

    .portfolio-container {
      width: 100%;
      max-width: 900px;
      height: calc(100vh - 120px);
      margin: 0 auto;
    }

    .portfolio-frame {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }

    .mobile-only {
      display: none;
    }

    .return {
      margin-top: 24px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      text-align: center;
    }

    a {
      color: #000;
      text-decoration: underline;
    }

    @media (max-width: 768px) {
      body {
        font-size: 16px;
        padding: 20px;
      }

      .portfolio-container {
        height: calc(100vh - 130px);
      }

      .desktop-only {
        display: none;
      }

      .mobile-only {
        display: block;
      }
    }
  </style>
</head>

<body>

  <div class="portfolio-container">
    
    <!-- SU PC -->
    <iframe
      class="portfolio-frame desktop-only"
      src="DevisBergantin_Portfolio2026.pdf"
      title="Devis Bergantin | Portfolio 2026">
    </iframe>

    <!-- SU MOBILE -->
    <iframe
      class="portfolio-frame mobile-only"
      src="https://github.io"
      title="Devis Bergantin | Portfolio 2026 Mobile Viewer">
    </iframe>

  </div>

  <div class="return">
    <a href="DevisBergantin_Portfolio2026.pdf" download>DOWNLOAD</a>
